<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
    <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    {{ block "head" . }}{{ end }}
</head>

  <body>
    <div class="container">
        <header class="site-header">
            <div class="site-header-top">
              <p class="site-section-label">Journal</p>
              <div class="site-header-tools">
                <nav class="site-nav">
                    <a href="/">App</a>
                    <a href="{{ "about" | relURL }}">About</a>
                </nav>
                <button id="theme-toggle" aria-label="Toggle dark mode">☀︎</button>
              </div>
            </div>
            <div class="site-brand-row">
              <a href="{{ "" | relURL }}" class="site-title-link">
                <img src="{{ "logo.svg" | absURL }}" alt="{{ .Site.Title }} logo" class="site-logo">
                <span class="site-title-text">{{ .Site.Title }}</span>
              </a>
              <p class="site-header-note">Making Strata Better.</p>
            </div>
        </header>

        <main>
        {{ block "main" . }}{{ end }}
        </main>

        <footer class="site-footer">
            <div>
              <p class="site-footer-title">{{ .Site.Title }}</p>
              <p class="site-footer-note">{{ .Site.Params.tagline }}</p>
            </div>
            <div class="site-footer-meta">
              <span>&copy; {{ now.Year }}</span>
              <a href="{{ "about#disclaimer" | relURL }}">Disclaimer</a>
            </div>
        </footer>
    </div>

    <script>
      var btn = document.getElementById('theme-toggle');
      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
        btn.textContent = t === 'dark' ? '☀︎' : '☾';
      }
      applyTheme(localStorage.getItem('theme') || 'light');
      btn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    </script>

  </body>
</html>
