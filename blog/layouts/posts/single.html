{{ define "main" }}
  <article class="post-page">
    <header class="post-header">
      <p class="section-label">Article</p>
      <h1>{{ .Title }}</h1>
      <div class="post-meta">{{ .Date.Format "Monday, 2 January 2006" }}</div>
      {{ with .Params.summary }}
        <p class="post-deck">{{ . }}</p>
      {{ end }}
    </header>
    {{ with .Params.featured_image }}
      <figure class="post-featured-image">
        <img src="{{ . }}" alt="{{ $.Params.featured_image_alt | default $.Title }}">
      </figure>
    {{ end }}
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
